name: Publish container image

# Publishing a release builds the CPU image with that release's weights baked in
# and pushes it to GHCR. The GPU variant is not built here: CI has no GPU to test
# it on, and the CUDA wheels make the image ~5 GB. Build that one locally with
#   docker build -t casita:gpu --build-arg TORCH_INDEX=https://download.pytorch.org/whl/cu124 .
on:
  release:
    types: [published]
  workflow_dispatch:   # manual run; builds without baked weights

jobs:
  cpu-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase image names, and the org has capitals in it.
      - name: Resolve image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # On a release, bake in that release's casita.pt. On a manual run the
          # URL is empty and the image expects weights to be mounted instead.
          build-args: |
            WEIGHTS_URL=${{ github.event_name == 'release' && format('https://github.com/{0}/releases/download/{1}/casita.pt', github.repository, github.event.release.tag_name) || '' }}
          tags: |
            ${{ steps.img.outputs.name }}:cpu
            ${{ steps.img.outputs.name }}:latest
            ${{ github.event_name == 'release' && format('{0}:{1}', steps.img.outputs.name, github.event.release.tag_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove the published image actually segments something, rather than only
      # that it built. Every step runs INSIDE the image -- the runner's Python has
      # no numpy/nibabel, and installing them would test the runner, not the image.
      # Passing no --weights also proves the release weights really are baked in.
      - name: Smoke test
        if: github.event_name == 'release'
        run: |
          IMG=${{ steps.img.outputs.name }}:cpu

          docker run --rm -v "$PWD":/data --entrypoint python "$IMG" -c "
          import numpy as np, nibabel as nib
          rng = np.random.default_rng(0)
          vol = rng.random((64, 64, 64)).astype('float32')
          vol[16:48, 16:48, 16:48] += 2.0          # a blob to find foreground in
          nib.save(nib.Nifti1Image(vol, np.eye(4)), '/data/smoke.nii.gz')
          "

          docker run --rm -v "$PWD":/data "$IMG" \
              /data/smoke.nii.gz --protocol feta --output /data/smoke_seg.nii.gz

          docker run --rm -v "$PWD":/data --entrypoint python "$IMG" -c "
          import numpy as np, nibabel as nib
          a, b = nib.load('/data/smoke_seg.nii.gz'), nib.load('/data/smoke.nii.gz')
          assert a.shape == b.shape, f'shape {a.shape} != input {b.shape}'
          assert np.allclose(a.affine, b.affine), 'affine does not match input'
          labels = set(np.unique(np.asanyarray(a.dataobj)).tolist())
          assert labels <= set(range(9)), f'unexpected labels: {labels}'
          assert 8 not in labels, 'feta must not predict channel 8'
          print(f'smoke test OK: shape {a.shape}, labels {sorted(labels)}')
          "
